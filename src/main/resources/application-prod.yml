# Production profile for the ZokoMart Admin backend.
# Contains NO secrets — everything is injected via environment variables
# (see deploy/backend/zokomart-admin.env.example). Activated with
# SPRING_PROFILES_ACTIVE=prod; ships in the jar, no pre-build copy step.
#
# Secrets never live in src/main/resources — the dev-machine local profile sits
# in backend/config/application-local.yml, which is gitignored and outside the
# resource root, so it cannot be packaged into the jar.
#
# Everything in application.yml (Flyway, MyBatis-Plus, Sa-Token, app.upload,
# app.wc.*) is shared across profiles; this file only supplies the datasource
# and Redis connection, mirroring application-dev.yml but env-driven.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zokomart_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
